version: '3.8'
services:

  # PHP Service
  app:
    build:
      args:
        user: ${DOCKER_USER}
        uid: ${DOCKER_UID}
      context: ./
      dockerfile: Dockerfile
    image: slack-website-app
    container_name: slack-website-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - slack-network
    environment:
      - DB_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: slack-website-nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx:/etc/nginx/conf.d/
    networks:
      - slack-network

networks:
  slack-network:
    driver: bridge
